<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector de Libros en Voz Alta</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <header>
    <h1>📖🔊 Lector en Voz Alta</h1>
    <p class="sub">Abre un PDF, EPUB o TXT y escúchalo como audiolibro.</p>
  </header>

  <main>
    <label id="dropzone" class="dropzone">
      <input id="fileInput" type="file" accept=".pdf,.epub,.txt,application/pdf,application/epub+zip,text/plain" hidden>
      <span id="dropText">Arrastra aquí tu libro o <u>haz clic para elegirlo</u><br><small>PDF · EPUB · TXT</small></span>
    </label>

    <section id="player" class="player hidden">
      <div class="book-title" id="bookTitle"></div>

      <div class="row">
        <label>Sección
          <select id="sectionSelect"></select>
        </label>
      </div>

      <div class="controls">
        <button id="prevBtn" title="Frase anterior">⏮</button>
        <button id="playBtn" class="play" title="Reproducir / Pausar">▶</button>
        <button id="stopBtn" title="Detener">⏹</button>
        <button id="nextBtn" title="Frase siguiente">⏭</button>
      </div>

      <div class="progress">
        <input id="progress" type="range" min="0" max="0" value="0">
        <span id="progressText">0 %</span>
      </div>

      <div class="row settings">
        <label>Voz
          <select id="voiceSelect"></select>
        </label>
        <label>Velocidad <span id="rateVal">1.0×</span>
          <input id="rate" type="range" min="0.5" max="2.5" step="0.1" value="1">
        </label>
        <label>Tono <span id="pitchVal">1.0</span>
          <input id="pitch" type="range" min="0.5" max="1.5" step="0.1" value="1">
        </label>
      </div>
      <p class="hint">Toca cualquier frase del texto para empezar a leer desde ahí.</p>
    </section>

    <article id="reader" class="reader hidden"></article>
  </main>

  <script src="app.js"></script>
</body>
</html>
